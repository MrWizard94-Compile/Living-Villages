name: Pinned Constitution adoption and source build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adoption:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out Living Villages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: project
          persist-credentials: false

      - name: Check out accepted WPAI Constitution
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: MrWizard94-Compile/Agents-Constitution
          ref: ded36646c11d61bcfa7e2420b81a278dc98f47e6
          path: constitution
          persist-credentials: false

      - name: Validate canonical source and tests
        working-directory: constitution
        run: |
          python3 tools/validate-source.py
          python3 -m unittest discover -s tests -v

      - name: Check project adoption
        run: python3 constitution/tools/check-adoption.py project

  source-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out Living Villages
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify official Gradle 8.12 wrapper JAR
        run: echo '2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check

      - name: Build and test without suppressing warnings
        run: bash ./gradlew build --warning-mode all
